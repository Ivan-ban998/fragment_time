name: fragment_time
description: 碎片时间 - 综合类碎片时间利用工具
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.40
  http: ^1.2.2
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  xml: ^6.5.0
  shared_preferences: ^2.3.4
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # 7/23 字体 ttf 移到 assets/ 根, Flutter pubspec asset: 拼 assets/ 前缀
  # asset: Roboto-Regular.ttf → URL assets/Roboto-Regular.ttf (不再双前缀 404)
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
