<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="碎片时间 - 综合类碎片时间利用工具">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="碎片时间">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>碎片时间</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6750A4">

  <!-- 6/25 PWA: 只在 HTTPS 注册 SW (HTTP 下浏览器拒绝, build_and_serve.sh 也会禁用) -->
  <script>
    if (location.protocol === 'https:' && 'serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch((e) => {
          console.warn('[SW] register failed:', e);
        });
      });
    }
  </script>
  <!-- 8/13 加 (沿 SOUL #137 #169 真凶链): 主动 unregister 老 SW + 清缓存
       真凶: HTTPS 下老 SW active 拦截 fetch, 返老 main.dart.js → 4 场景看到同一组 (老 RSS)
       修: 进入页面立即 unregister 老 SW + 清缓存, 强制浏览器拿新版
       ft_server.py 已经返 404 阻止新 SW register, 配合 unregister 旧 SW 强制清缓存 -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        for (const reg of regs) {
          reg.unregister().then(() => console.log('[SW-cleanup] unregistered:', reg.scope));
        }
      });
      if (window.caches) {
        caches.keys().then(keys => {
          for (const k of keys) caches.delete(k);
        });
      }
    }
  </script>
</head>
<body>
  <!-- 7/24 14:52 Brien 反馈 console: GET /fonts/notosanssc/v36/<hash>.ttf 404 + GET /fonts/notoemoji/v47/<hash>.ttf 404 -->
  <!-- 真凶链: fontFallbackBaseUrl='/fonts/' 让 Flutter 引擎拼本地路径, 但引擎内部仍期望 notosanssc/v36/ + notoemoji/v47/ Google Fonts 子目录结构 -->
  <!-- 真修: 删 fontFallbackBaseUrl, 让 Flutter 走默认 Google Fonts CDN (网络不通 → 引擎 fallback 不 fetch → 不报 404) -->
  <!-- 中文走 Theme fontFamilyFallback 系统字体链 (PingFang / YaHei / Hiragino / Noto Sans CJK SC) -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
